<style>
:root{--v:#0F4D3A;--vd:#0A3528;--or:#E9B949;--bg:#F4F7F5;--tx:#12251D;--mu:#5B6B63;--bd:#D5DED9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}
.top{background:var(--v);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px}
.top img{width:48px;height:48px;border-radius:50%;display:block}
.nom{font:700 18px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.5px}
.slogan{color:var(--or);font-size:13px}
main{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:14px;padding:16px}
.solde{background:var(--vd);color:#fff;border-radius:14px;padding:18px}
.solde b{display:block;font:700 32px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--or);margin:2px 0}
.solde small{color:#CFE3D9;font-size:13px}
h2{font:700 16px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0 0 6px}
label{display:block;font:600 13px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:12px 0 6px}
input,select{width:100%;height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;font:inherit;background:#fff;color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;flex:none}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;margin:8px 0 0;font-weight:400}
button{min-height:48px;border:0;border-radius:10px;font:700 15px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;cursor:pointer;padding:0 16px}
.bp{background:var(--v);color:#fff;width:100%;margin-top:16px}
.bo{background:var(--or);color:var(--vd)}
.bg{background:var(--v);color:#fff}
.bl{background:none;color:#fff;min-height:44px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:#fff;border:1px solid var(--bd);color:var(--tx)}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.err{background:#FBE9E7;color:#8A1C10}
.ok{background:#E3F2EA;color:#0A3528}
.mu{color:var(--mu);font-size:13px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{background:#fff;border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mu)}
.stats b{display:block;font:700 22px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--v)}
.lien{background:#EAF2EE;border-radius:8px;padding:12px;font:600 13px Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;word-break:break-all;color:var(--v);margin-top:8px}
.dual{display:flex;gap:10px;margin-top:10px}
.dual button{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row b{color:var(--v)}
html,body{overflow-x:hidden}
.wrap{overflow-x:hidden}
.t{flex:1;min-width:0}
.top img{flex:none}
.bl{flex:none;padding:0 8px}
.nom{font-size:17px}
.card{overflow-wrap:anywhere}
</style>

<script>
function showErr(m){
  var b=document.getElementById('errbar');
  if(!b){b=document.createElement('div');b.id='errbar';b.setAttribute('role','alert');b.style.cssText='background:#FBE9E7;color:#8A1C10;padding:10px 14px;font:600 13px system-ui,-apple-system,sans-serif';document.body.insertBefore(b,document.body.firstChild);}
  b.textContent='Un problème est survenu : '+m;
}
window.addEventListener('error',function(e){
  /* Les erreurs venant d'extensions ou d'autres sites (sans détail) sont ignorées */
  if(!e.error||!e.message||e.message==='Script error.')return;
  showErr(e.message);
});
window.addEventListener('unhandledrejection',function(e){
  var r=e.reason;showErr(r&&r.message?r.message:String(r));
});
</script>

/* ---------- Accès à Supabase (sans bibliothèque externe) ---------- */
async function api(path, o) {
  o = o || {};
  const h = Object.assign({ apikey: SB_KEY }, o.headers || {});
  if (o.body !== undefined) h['Content-Type'] = 'application/json';
  if (o.token) h.Authorization = 'Bearer ' + o.token;
  let r;
  try {
    r = await fetch(SB_URL + path, { method: o.method || 'GET', headers: h, body: o.body !== undefined ? JSON.stringify(o.body) : undefined });
  } catch (e) { const x = new Error('network'); x.network = true; throw x; }
  const txt = await r.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (_) { data = txt; }
  if (!r.ok) {
    const x = new Error((data && (data.msg || data.error_description || data.message || data.error)) || ('Erreur ' + r.status));
    x.status = r.status; throw x;
  }
  return data;
}
let mem = null;
function saveS(s) { mem = s; try { s ? localStorage.setItem('tch_s', JSON.stringify(s)) : localStorage.removeItem('tch_s'); } catch (_) {} }
function loadS() { if (mem) return mem; try { return JSON.parse(localStorage.getItem('tch_s') || 'null'); } catch (_) { return null; } }
const mk = d => ({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), uid: d.user && d.user.id });
async function getSession() {
  let s = loadS();
  if (!s || !s.access_token) return null;
  if (s.expires_at - 60 < Date.now() / 1000) {
    try { s = mk(await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: s.refresh_token } })); saveS(s); }
    catch (_) { saveS(null); return null; }
  }
  return s;
}

function trad(e) {
  if (e && e.network) return 'Connexion impossible. Vérifiez votre connexion internet puis réessayez.';
  const m = (e && e.message) || '';
  if (/already registered|already exists/i.test(m)) return 'Cette adresse e-mail a déjà un compte.';
  if (/invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/password should/i.test(m)) return 'Le mot de passe doit contenir au moins 6 caractères.';
  if (/invalid format|valid email/i.test(m)) return 'Adresse e-mail invalide.';
  if (/not confirmed/i.test(m)) return 'Confirmez d’abord votre e-mail : vérifiez votre boîte de réception.';
  if (/rate limit|too many/i.test(m)) return 'Trop de tentatives. Réessayez dans quelques minutes.';
  if (/solde insuffisant/i.test(m)) return 'Solde insuffisant pour ce retrait.';
  return 'Une erreur est survenue : ' + m;
}
function msg(text, type) {
  const el = $('#m');
  if (el) el.innerHTML = text ? '<div class="msg ' + type + '">' + esc(text) + '</div>' : '';
}

}

  $('#app').innerHTML = enTete() +
    '<main><div class="tabs"><button id="t-in" class="' + (up ? '' : 'on') + '">Connexion</button><button id="t-up" class="' + (up ? 'on' : '') + '">Inscription</button></div>' +
    '<div class="card"><h2>' + (up ? 'Bienvenue chez TCHOUATCHOUA !' : 'Heureux de vous revoir. Prêt à gagner aujourd’hui ?') + '</h2>' +
    '<p class="mu">' + (up ? 'Partagez vos premiers produits et gagnez dès votre première vente. Inscription gratuite, sans frais d’entrée.' : 'Connectez-vous pour suivre vos gains et votre équipe.') + '</p>' +
    '<form id="f" novalidate>' + champs + '<div id="m" role="alert"></div><button class="bp" id="go">' + (up ? 'Créer mon compte' : 'Se connecter') + '</button></form></div></main>';
  $('#t-in').onclick = () => authView('in');
  $('#t-up').onclick = () => authView('up');
  $('#f').onsubmit = e => { e.preventDefault(); up ? inscrire() : connecter(); };
}

async function connecter() {
  const go = $('#go'); go.disabled = true; msg('', '');
  try {
    const d = await api('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: $('#mail').value.trim(), password: $('#mdp').value } });
    saveS(mk(d));
    route();
  } catch (e) { go.disabled = false; msg(trad(e), 'err'); }
}

async function inscrire() {
  const nom = $('#nom').value.trim(), mail = $('#mail').value.trim(), mdp = $('#mdp').value;
  const code = $('#code').value.trim().toUpperCase();
  if (!nom) return msg('Entrez votre nom complet.', 'err');
  if (!mail) return msg('Entrez votre adresse e-mail.', 'err');
  if (mdp.length < 6) return msg('Le mot de passe doit contenir au moins 6 caractères.', 'err');
  if (!$('#cgu').checked) return msg('Acceptez les conditions d’utilisation pour continuer.', 'err');
  const go = $('#go'); go.disabled = true; msg('', '');
  try {
    if (code) {
      const ok = await api('/rest/v1/rpc/verifier_code_parrain', { method: 'POST', body: { p_code: code } });
      if (ok !== true) { go.disabled = false; return msg('Ce code parrain n’existe pas. Vérifiez-le ou laissez le champ vide.', 'err'); }
    }
    const d = await api('/auth/v1/signup', { method: 'POST', body: { email: mail, password: mdp, data: { nom, telephone: $('#tel').value.trim(), pays: $('#pays').value, code_parrain: code } } });
    if (d && d.access_token) { saveS(mk(d)); return route(); }
    go.disabled = false;
    msg('Compte créé. Confirmez votre adresse e-mail grâce au message reçu, puis connectez-vous.', 'ok');
  } catch (e) { go.disabled = false; msg(trad(e), 'err'); }
}

function quitter() { saveS(null); authView('in'); }

async function dash(s) {
  const T = s.access_token;
  $('#app').innerHTML = enTete('<button class="bl" id="out" style="margin-left:auto">Quitter</button>') + '<main><p class="mu">Chargement…</p></main>';
  $('#out').onclick = quitter;
  let m, c, r, n;
  try {
    [m, c, r, n] = await Promise.all([
      api('/rest/v1/membres?select=nom,code_parrain&id=eq.' + s.uid, { token: T, headers: { Accept: 'application/vnd.pgrst.object+json' } }),
      api('/rest/v1/commissions?select=niveau,montant,statut,cree_le&order=cree_le.desc', { token: T }),
      api('/rest/v1/retraits?select=montant,statut', { token: T }),
      api('/rest/v1/rpc/mon_reseau', { method: 'POST', body: {}, token: T })
    ]);
  } catch (e) {
    if (e.status === 401) return quitter();
    $('main').innerHTML = '<div class="card"><h2>Profil introuvable</h2><p class="mu">Vos données n’ont pas pu être chargées (' + esc(trad(e)) + '). Déconnectez-vous puis reconnectez-vous.</p></div>';
    return;
  }
  const coms = c || [], rets = r || [];
  const somme = (l, f) => l.filter(f).reduce((t, x) => t + x.montant, 0);
  const validee = somme(coms, x => x.statut === 'validee');
  const attente = somme(coms, x => x.statut === 'en_attente');
  const retire = somme(rets, x => x.statut === 'demande' || x.statut === 'paye');
  const dispo = validee - retire;
  const niv = { 1: 0, 2: 0, 3: 0 };
  (n || []).forEach(x => { niv[x.niveau] = Number(x.nb); });
  const lien = location.origin + location.pathname + '?ref=' + m.code_parrain;
  const lignes = coms.slice(0, 5).map(x =>
    '<div class="row"><div>' + (x.niveau === 0 ? 'Vente directe' : 'Niveau ' + x.niveau) +
    '<p class="mu">' + STATUT[x.statut] + ' · ' + new Date(x.cree_le).toLocaleDateString('fr-FR') + '</p></div><b>+' + fcfa(x.montant) + '</b></div>').join('');
  $('main').innerHTML =
    '<div class="card"><h2>Bonjour, ' + esc(m.nom) + '</h2><p class="mu">Heureux de vous revoir. Prêt à gagner aujourd’hui ?</p></div>' +
    '<div class="solde"><span>Gains disponibles</span><b>' + fcfa(dispo) + '</b><small>En attente de validation : ' + fcfa(attente) + '</small></div>' +
    '<div class="stats"><div><b>' + niv[1] + '</b>Niveau 1</div><div><b>' + niv[2] + '</b>Niveau 2</div><div><b>' + niv[3] + '</b>Niveau 3</div></div>' +
    '<div class="card"><h2>Mon lien d’invitation</h2><p class="mu">Code parrain : ' + esc(m.code_parrain) + '</p><div class="lien">' + esc(lien) + '</div>' +
    '<div class="dual"><button class="bg" id="cp">Copier le lien</button><button class="bo" id="wa">WhatsApp</button></div></div>' +
    '<div class="card"><h2>Dernières commissions</h2>' + (lignes || '<p class="mu">Aucune commission pour l’instant. Partagez votre lien pour réaliser votre première vente.</p>') + '</div>' +
    '<div class="card"><h2>Demander un retrait</h2><p class="mu">Minimum 5 000 FCFA. Les commissions sont validées 7 jours après la livraison.</p>' +
    '<form id="rf" novalidate><label for="rm">Montant (FCFA)</label><input id="rm" type="number" inputmode="numeric" min="5000" step="500">' +
    '<label for="rt">Moyen de paiement</label><select id="rt"><option>Mobile Money</option></select>' +
    '<div id="m" role="alert"></div><button class="bp" id="rb">Demander le retrait</button></form></div>';
  $('#cp').onclick = async e => {
    try { await navigator.clipboard.writeText(lien); e.target.textContent = 'Lien copié'; }
    catch (_) { window.prompt('Copiez ce lien :', lien); }
  };
  $('#wa').onclick = () => window.open('https://wa.me/?text=' + encodeURIComponent('Rejoins-moi sur TCHOUATCHOUA : achetez, partagez, gagnez. ' + lien), '_blank');
  $('#rf').onsubmit = async e => {
    e.preventDefault(); msg('', '');
    const montant = parseInt($('#rm').value, 10);
    if (!montant || montant < 5000) return msg('Le retrait minimum est de 5 000 FCFA.', 'err');
    if (montant > dispo) return msg('Solde insuffisant pour ce retrait.', 'err');
    $('#rb').disabled = true;
    try {
      await api('/rest/v1/retraits', { method: 'POST', token: T, headers: { Prefer: 'return=minimal' }, body: { membre_id: s.uid, montant, methode: $('#rt').value } });
    } catch (err) { $('#rb').disabled = false; return msg(trad(err), 'err'); }
    await dash(s);
    msg('Demande de retrait envoyée.', 'ok');
  };
}

async function route() {
  const s = await getSession();
  if (s) dash(s); else authView(REF ? 'up' : 'in');
}
async function init() {
  authView(REF ? 'up' : 'in');
  try { const s = await getSession(); if (s) dash(s); } catch (e) { /* on reste sur l'écran de connexion */ }
}
init();
</script>
</body>
</html>

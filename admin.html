<style>
:root{--v:#0F4D3A;--vd:#0A3528;--or:#E9B949;--bg:#F4F7F5;--tx:#12251D;--mu:#5B6B63;--bd:#D5DED9}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.top{background:var(--v);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.top img{width:44px;height:44px;border-radius:50%;display:block;flex:none}
.t{flex:1;min-width:0}
.nom{font:700 17px Inter,system-ui,-apple-system,sans-serif;letter-spacing:.5px}
.sl{color:var(--or);font-size:13px}
main{padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;overflow-wrap:anywhere}
.card p{margin:4px 0}
h2{font:700 16px Inter,system-ui,-apple-system,sans-serif;margin:0 0 6px}
label{display:block;font:600 13px Inter,system-ui,-apple-system,sans-serif;margin:12px 0 6px}
input,select{width:100%;height:46px;border:1px solid var(--bd);border-radius:10px;padding:0 14px;font:inherit;background:#fff;color:var(--tx)}
button{min-height:44px;border:0;border-radius:10px;font:700 14px Inter,system-ui,-apple-system,sans-serif;cursor:pointer;padding:0 14px}
.bp{background:var(--v);color:#fff;width:100%;margin-top:16px;min-height:48px;font-size:15px}
.bo{background:var(--or);color:var(--vd)}
.bg{background:var(--v);color:#fff}
.bd{background:#fff;color:#8A1C10;border:1px solid #E5B7B0}
.bl{background:none;color:#fff;flex:none;padding:0 8px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1;background:#fff;border:1px solid var(--bd);color:var(--tx);padding:0 4px}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.msg{padding:12px 14px;border-radius:10px;font-size:14px}
.err{background:#FBE9E7;color:#8A1C10}
.ok{background:#E3F2EA;color:#0A3528}
.mu{color:var(--mu);font-size:13px}

}

  if (e && e.network) return 'Connexion impossible. Vérifiez votre connexion internet puis réessayez.';
  const m = (e && e.message) || '';
  if (e && e.code === 'P0001') return m;
  if (e && (e.code === '42501' || /row-level security|permission denied/i.test(m))) return 'Action non autorisée : ce compte n’est pas administrateur.';
  if (/invalid login/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/not confirmed/i.test(m)) return 'Confirmez d’abord votre e-mail.';
  if (/rate limit|too many/i.test(m)) return 'Trop de tentatives. Réessayez dans quelques minutes.';
  return 'Une erreur est survenue : ' + m;
}
function note(text, type) {
  const el = $('#m');
  if (el) el.innerHTML = text ? '<div class="msg ' + type + '">' + esc(text) + '</div>' : '';
}
function entete(extra) {
  return '<header class="top"><img src="' + LOGO + '" alt="Logo TCHOUATCHOUA"><div class="t"><div class="nom">TCHOUATCHOUA</div><div class="sl">Administration</div></div>' + (extra || '') + '</header>';
}
function quitter() { saveS(null); SESS = null; authView(); }

/* ---------- Connexion ---------- */
function authView() {
  $('#app').innerHTML = entete() +
    '<main><div class="card"><h2>Connexion administrateur</h2><p class="mu">Réservé à l’équipe TCHOUATCHOUA.</p>' +
    '<form id="f" novalidate><label for="mail">E-mail</label><input id="mail" type="email" autocomplete="email">' +
    '<label for="mdp">Mot de passe</label><input id="mdp" type="password" autocomplete="current-password">' +
    '<div id="m" role="alert" style="margin-top:12px"></div><button class="bp" id="go">Se connecter</button></form></div></main>';
  $('#f').onsubmit = async e => {
    e.preventDefault(); note('', '');
    const go = $('#go'); go.disabled = true;
    try {
      const d = await api('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: $('#mail').value.trim(), password: $('#mdp').value } });
      saveS(mk(d)); await ouvrir(mk(d));
    } catch (err) { go.disabled = false; note(trad(err), 'err'); }
  };
}

async function ouvrir(s) {
  SESS = s;
  let ok;
  try { ok = await api('/rest/v1/rpc/est_admin', { method: 'POST', body: {}, token: s.access_token }); }
  catch (e) {
    if (e.status === 401) return quitter();
    $('#app').innerHTML = entete('<button class="bl" id="out">Quitter</button>') + '<main><div class="card"><h2>Erreur</h2><p class="mu">' + esc(trad(e)) + '</p></div></main>';
    $('#out').onclick = quitter; return;
  }
  if (ok !== true) {
    $('#app').innerHTML = entete('<button class="bl" id="out">Quitter</button>') + '<main><div class="card"><h2>Accès réservé</h2><p class="mu">Ce compte n’est pas administrateur.</p></div></main>';
    $('#out').onclick = quitter; return;
  }
  shell();
}

function shell() {
  const tabs = [['cmd', 'Commandes'], ['prod', 'Produits'], ['ret', 'Retraits']]
    .map(t => '<button data-t="' + t[0] + '" class="' + (t[0] === ONGLET ? 'on' : '') + '">' + t[1] + '</button>').join('');
  $('#app').innerHTML = entete('<button class="bl" id="out">Quitter</button>') + '<main><div class="tabs" id="tabs">' + tabs + '</div><div id="vue"></div></main>';
  $('#out').onclick = quitter;
  $('#tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (!b) return; ONGLET = b.dataset.t; shell(); };
  if (ONGLET === 'cmd') vueCommandes(); else if (ONGLET === 'prod') vueProduits(); else vueRetraits();
}

function erreurVue(e) {
  if (e.status === 401) return quitter();
  $('#vue').innerHTML = '<div class="card"><h2>Chargement impossible</h2><p class="mu">' + esc(trad(e)) + '</p></div>';
}

/* ---------- Commandes ---------- */
async function vueCommandes() {
  const T = SESS.access_token, v = $('#vue');
  v.innerHTML = '<div id="m" role="alert"></div><p class="mu">Chargement…</p>';
  let cm, pr, mb, lg;
  try {
    [cm, pr, mb] = await Promise.all([
      api('/rest/v1/commandes?select=id,membre_id,vendeur_direct_id,statut,total,cree_le&order=cree_le.desc&limit=30', { token: T }),
      api('/rest/v1/produits?select=id,nom,prix,actif&order=nom', { token: T }),
      api('/rest/v1/membres?select=id,nom,code_parrain', { token: T })
    ]);
    lg = cm.length ? await api('/rest/v1/lignes_commande?select=commande_id,produit_id,quantite&commande_id=in.(' + cm.map(c => c.id).join(',') + ')', { token: T }) : [];
  } catch (e) { return erreurVue(e); }
  const M = {}; mb.forEach(m => { M[m.id] = m; });
  const P = {}; pr.forEach(p => { P[p.id] = p; });
  const qui = id => (id && M[id]) ? esc(M[id].nom) + ' (' + esc(M[id].code_parrain) + ')' : '—';
  const opts = pr.filter(p => p.actif).map(p => '<option value="' + p.id + '">' + esc(p.nom) + ' – ' + fcfa(p.prix) + '</option>').join('');
  const cartes = cm.map(c => {
    const lignes = lg.filter(x => x.commande_id === c.id).map(x => x.quantite + ' × ' + esc((P[x.produit_id] || {}).nom || 'Produit')).join(', ');
    const bt = [];
    if (c.statut === 'en_attente') bt.push(['payee', 'Payée', 'bg']);
    if (c.statut === 'en_attente' || c.statut === 'payee') { bt.push(['livree', 'Livrée', 'bo']); bt.push(['annulee', 'Annuler', 'bd']); }
    return '<div class="card"><div class="row"><b>#' + c.id.slice(0, 6).toUpperCase() + '</b><span class="badge s-' + c.statut + '">' + LBL[c.statut] + '</span></div>' +
      '<p>' + (lignes || '—') + '</p><p class="mu">Total : ' + fcfa(c.total) + ' · ' + new Date(c.cree_le).toLocaleDateString('fr-FR') + '</p>' +
      '<p class="mu">Acheteur : ' + qui(c.membre_id) + '<br>Vendeur direct : ' + qui(c.vendeur_direct_id) + '</p>' +
      (bt.length ? '<div class="dual">' + bt.map(x => '<button class="' + x[2] + '" data-act="st" data-id="' + c.id + '" data-s="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' : '') + '</div>';
  }).join('');
  v.innerHTML = '<div id="m" role="alert"></div>' +
    '<div class="card"><h2>Nouvelle commande</h2><p class="mu">Enregistrez une vente faite par un membre (WhatsApp, en personne…).</p>' +
    '<form id="fc" novalidate><label for="fv">Code parrain du vendeur (le membre qui a vendu)</label><input id="fv" autocapitalize="characters">' +
    '<label for="fa">Code parrain de l’acheteur (facultatif)</label><input id="fa" autocapitalize="characters">' +
    '<label for="fp">Produit</label><select id="fp">' + (opts || '<option value="">Aucun produit : ajoutez-en d’abord</option>') + '</select>' +
    '<label for="fq">Quantité</label><input id="fq" type="number" inputmode="numeric" min="1" value="1">' +
    '<button class="bp">Enregistrer la commande</button></form></div>' +
    '<h2 style="margin:6px 2px 0">Dernières commandes</h2>' + (cartes || '<p class="mu">Aucune commande pour l’instant.</p>');
  v.onsubmit = async e => {
    e.preventDefault(); note('', '');
    if (!$('#fp').value) return note('Ajoutez d’abord un produit dans l’onglet Produits.', 'err');
    try {
      await api('/rest/v1/rpc/admin_creer_commande', { method: 'POST', token: T, body: { p_code_vendeur: $('#fv').value.trim(), p_code_acheteur: $('#fa').value.trim(), p_produit: $('#fp').value, p_quantite: parseInt($('#fq').value, 10) || 1 } });
      await vueCommandes(); note('Commande enregistrée.', 'ok');
    } catch (err) { note(trad(err), 'err'); }
  };
  v.onclick = async e => {
    const b = e.target.closest('button[data-act="st"]'); if (!b) return;
    const msgc = b.dataset.s === 'livree' ? 'Marquer cette commande comme livrée ? Les commissions du réseau seront calculées.' : 'Confirmer ce changement de statut ?';
    if (!window.confirm(msgc)) return;
    b.disabled = true;
    try {
      await api('/rest/v1/rpc/admin_changer_statut', { method: 'POST', token: T, body: { p_commande: b.dataset.id, p_statut: b.dataset.s } });
      await vueCommandes(); note('Statut mis à jour.', 'ok');
    } catch (err) { b.disabled = false; note(trad(err), 'err'); }
  };
}

/* ---------- Produits et vendeurs ---------- */
async function vueProduits() {
  const T = SESS.access_token, v = $('#vue');
  v.innerHTML = '<div id="m" role="alert"></div><p class="mu">Chargement…</p>';
  let vd, pr;
  try {
    [vd, pr] = await Promise.all([
      api('/rest/v1/vendeurs?select=id,nom,pays&order=nom', { token: T }),
      api('/rest/v1/produits?select=id,nom,type,prix,actif,vendeur_id&order=cree_le.desc', { token: T })
    ]);
  } catch (e) { return erreurVue(e); }
  const V = {}; vd.forEach(x => { V[x.id] = x; });
  const optV = '<option value="">Aucun (produit TCHOUATCHOUA)</option>' + vd.map(x => '<option value="' + x.id + '">' + esc(x.nom) + '</option>').join('');
  const liste = pr.map(p =>
    '<div class="card"><div class="row"><b>' + esc(p.nom) + '</b><span class="badge s-' + (p.actif ? 'actif' : 'inactif') + '">' + (p.actif ? 'Actif' : 'Désactivé') + '</span></div>' +
    '<p class="mu">' + (p.type === 'digital' ? 'Digital' : 'Physique') + ' · ' + fcfa(p.prix) + ' · ' + (p.vendeur_id && V[p.vendeur_id] ? esc(V[p.vendeur_id].nom) : 'TCHOUATCHOUA') + '</p>' +
    '<div class="dual"><button class="' + (p.actif ? 'bd' : 'bg') + '" data-act="tg" data-id="' + p.id + '" data-a="' + (p.actif ? '0' : '1') + '">' + (p.actif ? 'Désactiver' : 'Activer') + '</button></div></div>').join('');
  v.innerHTML = '<div id="m" role="alert"></div>' +
    '<div class="card"><h2>Ajouter un vendeur</h2><form id="fvd" novalidate><label for="vn">Nom du vendeur</label><input id="vn">' +
    '<label for="vp">Pays</label><select id="vp"><option>Niger</option><option>Ghana</option><option>Autre pays</option></select><button class="bp">Ajouter le vendeur</button></form></div>' +
    '<div class="card"><h2>Ajouter un produit</h2><form id="fpr" novalidate><label for="pn">Nom du produit</label><input id="pn">' +
    '<label for="pt">Type</label><select id="pt"><option value="physique">Physique</option><option value="digital">Digital</option></select>' +
    '<label for="pp">Prix (FCFA)</label><input id="pp" type="number" inputmode="numeric" min="1">' +
    '<label for="pv">Vendeur</label><select id="pv">' + optV + '</select><button class="bp">Ajouter le produit</button></form></div>' +
    '<h2 style="margin:6px 2px 0">Catalogue (' + pr.length + ')</h2>' + (liste || '<p class="mu">Aucun produit pour l’instant.</p>');
  v.onsubmit = async e => {
    e.preventDefault(); note('', '');
    try {
      if (e.target.id === 'fvd') {
        const nom = $('#vn').value.trim(); if (!nom) return note('Entrez le nom du vendeur.', 'err');
        await api('/rest/v1/vendeurs', { method: 'POST', token: T, headers: { Prefer: 'return=minimal' }, body: { nom, pays: $('#vp').value } });
        await vueProduits(); note('Vendeur ajouté.', 'ok');
      } else {
        const nom = $('#pn').value.trim(), prix = parseInt($('#pp').value, 10);
        if (!nom) return note('Entrez le nom du produit.', 'err');
        if (!prix || prix < 1) return note('Entrez un prix valide.', 'err');
        await api('/rest/v1/produits', { method: 'POST', token: T, headers: { Prefer: 'return=minimal' }, body: { nom, type: $('#pt').value, prix, vendeur_id: $('#pv').value || null } });
        await vueProduits(); note('Produit ajouté.', 'ok');
      }
    } catch (err) { note(trad(err), 'err'); }
  };
  v.onclick = async e => {
    const b = e.target.closest('button[data-act="tg"]'); if (!b) return;
    b.disabled = true;
    try {
      await api('/rest/v1/produits?id=eq.' + b.dataset.id, { method: 'PATCH', token: T, headers: { Prefer: 'return=minimal' }, body: { actif: b.dataset.a === '1' } });
      await vueProduits(); note('Produit mis à jour.', 'ok');
    } catch (err) { b.disabled = false; note(trad(err), 'err'); }
  };
}

/* ---------- Retraits ---------- */
async function vueRetraits() {
  const T = SESS.access_token, v = $('#vue');
  v.innerHTML = '<div id="m" role="alert"></div><p class="mu">Chargement…</p>';
  let rt, mb;
  try {
    [rt, mb] = await Promise.all([
      api('/rest/v1/retraits?select=id,membre_id,montant,methode,statut,cree_le&order=cree_le.desc&limit=40', { token: T }),
      api('/rest/v1/membres?select=id,nom,code_parrain,telephone', { token: T })
    ]);
  } catch (e) { return erreurVue(e); }
  const M = {}; mb.forEach(m => { M[m.id] = m; });
  const cartes = rt.map(r => {
    const m = M[r.membre_id] || {};
    return '<div class="card"><div class="row"><b>' + fcfa(r.montant) + '</b><span class="badge s-' + r.statut + '">' + LBL[r.statut] + '</span></div>' +
      '<p>' + esc(m.nom || 'Membre') + ' (' + esc(m.code_parrain || '—') + ')</p>' +
      '<p class="mu">Téléphone : ' + esc(m.telephone || 'non renseigné') + ' · ' + esc(r.methode) + ' · ' + new Date(r.cree_le).toLocaleDateString('fr-FR') + '</p>' +
      (r.statut === 'demande' ? '<div class="dual"><button class="bg" data-act="rt" data-id="' + r.id + '" data-s="paye">Marquer payé</button><button class="bd" data-act="rt" data-id="' + r.id + '" data-s="refuse">Refuser</button></div>' : '') + '</div>';
  }).join('');
  v.innerHTML = '<div id="m" role="alert"></div><h2 style="margin:0 2px">Demandes de retrait</h2>' +
    '<p class="mu" style="margin:0 2px">Envoyez l’argent au membre (Mobile Money) avant de marquer la demande comme payée.</p>' +
    (cartes || '<p class="mu">Aucune demande pour l’instant.</p>');
  v.onclick = async e => {
    const b = e.target.closest('button[data-act="rt"]'); if (!b) return;
    if (!window.confirm(b.dataset.s === 'paye' ? 'Confirmer que ce retrait a bien été payé au membre ?' : 'Refuser cette demande de retrait ?')) return;
    b.disabled = true;
    try {
      await api('/rest/v1/rpc/admin_changer_retrait', { method: 'POST', token: T, body: { p_retrait: b.dataset.id, p_statut: b.dataset.s } });
      await vueRetraits(); note('Demande mise à jour.', 'ok');
    } catch (err) { b.disabled = false; note(trad(err), 'err'); }
  };
}

/* ---------- Démarrage ---------- */
async function init() {
  authView();
  try { const s = await getSession(); if (s) await ouvrir(s); } catch (e) { /* on reste sur la connexion */ }
}
init();
</script>
